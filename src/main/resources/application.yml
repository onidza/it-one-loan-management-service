server:
  port: 8082

spring:
  application:
    name: loan-management-service

  jpa:
    hibernate:
      ddl-auto: create-drop
    show_sql: true

    properties:
      hibernate:
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 50

  kafka:
    bootstrap-servers: localhost:29092

    consumer:
      group-id: loan-management-service

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      auto-offset-reset: earliest
      enable-auto-commit: false

      properties:
        spring.json.trusted.packages: ru.creditbank.loanmanagementservice.dto.kafka
        spring.json.use.type.headers: false
        spring.json.value.default.type: ru.creditbank.loanmanagementservice.dto.kafka.LoanIssuanceEventDTO

    listener:
      ack-mode: record

logging:
  level:
    org.springframework.security: DEBUG

security:
  jwt:
    issuer: ${SECURITY_JWT_ISSUER:apigateway} #.env
    secret: ${SECURITY_JWT_SECRET:McHowHFh9zfPUjAu6VdpgKm+zzOTzrpNmElKZana3RM=} #.env
